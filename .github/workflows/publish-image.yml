name: Publish image

# Only version tags publish, so the server changes only on a deliberate release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The tag must match APP_VERSION, so the image tag and the version the app reports agree.
      - name: Check the tag matches APP_VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(grep -Po '^APP_VERSION = "\K[^"]+' app/config.py)"
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION $app_version in app/config.py"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags X.Y.Z and latest; also adds the OCI labels that link the package to this repo.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

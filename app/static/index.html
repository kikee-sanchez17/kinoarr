<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kinoarr</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="page-header">
    <h1>Kinoarr</h1>
  </header>

  <main>
    <section aria-labelledby="search-heading">
      <h2 id="search-heading">Search</h2>
      <form id="search-form" class="search-form" role="search">
        <input id="search-query" type="search" placeholder="Movie title" aria-label="Movie title" autocomplete="off">
        <button type="submit">Search</button>
      </form>
      <p id="search-status" class="status" role="status"></p>
      <table id="results-table" class="results" hidden>
        <thead>
          <tr>
            <th>Title</th>
            <th>Indexer</th>
            <th class="numeric">Size</th>
            <th class="numeric">Seeders</th>
            <th class="numeric">Leechers</th>
            <th>Published</th>
            <th><span class="visually-hidden">Action</span></th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
      <button id="show-more" type="button" class="secondary" hidden>Show more</button>
    </section>

    <section aria-labelledby="downloads-heading">
      <h2 id="downloads-heading">Downloads</h2>
      <p id="downloads-status" class="status" role="status"></p>
      <ul id="downloads-list" class="downloads"></ul>
    </section>
  </main>
</body>
</html>

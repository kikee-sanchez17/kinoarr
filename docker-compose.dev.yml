# Local test environment: supporting services only (Kinoarr runs with uvicorn on your PC).
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: kinoarr-dev-qbittorrent
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - WEBUI_PORT=8081
    volumes:
      - ./dev-config/qbittorrent:/config
      - ./dev-media:/downloads
    ports:
      - "8081:8081"
      - "6881:6881"
      - "6881:6881/udp"
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: kinoarr-dev-prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./dev-config/prowlarr:/config
    ports:
      - "9696:9696"

services:
  kinoarr:
    image: ghcr.io/kikee-sanchez17/kinoarr:latest
    # Or build it yourself from a clone: docker compose up -d --build
    build: .
    container_name: kinoarr
    restart: unless-stopped
    # Must be able to write into the downloads folder to save subtitles:
    # usually the same IDs as the qBittorrent container.
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    volumes:
      # Same internal path as qBittorrent (/downloads), so no path mapping is needed
      - ${MEDIA_PATH}:/downloads
    networks:
      - proxy-net   # Nginx Proxy Manager reaches kinoarr:8000
      - media-net   # qBittorrent (and Prowlarr) reachable by name
    # No port is published in production: the only way in is the proxy
    # (with an Access List). For local testing, uncomment:
    # ports:
    #   - "8000:8000"

networks:
  proxy-net:
    external: true
  media-net:
    external: true

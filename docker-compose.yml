services:
  kinoarr:
    build: .
    container_name: kinoarr
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    volumes:
      # Same internal path as qBittorrent (/downloads), so no path mapping is needed
      - ${MEDIA_PATH}:/downloads
    networks:
      - proxy-net   # Nginx Proxy Manager reaches kinoarr:8000
      - media-net   # qBittorrent (and Prowlarr) reachable by name
    # No port is published in production: the only way in is the proxy
    # (with an Access List). For local testing, uncomment:
    # ports:
    #   - "8000:8000"

networks:
  proxy-net:
    external: true
  media-net:
    external: true

services:
  kinoarr:
    build: .
    container_name: kinoarr
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    volumes:
      # Misma ruta interna que qBittorrent (/downloads) para no mapear rutas
      - ${MEDIA_PATH}:/downloads
    extra_hosts:
      # Jellyfin corre en network_mode: host
      - "host.docker.internal:host-gateway"
    networks:
      - proxy-net   # Nginx Proxy Manager llega a kinoarr:8000
      - media-net   # qBittorrent (y Prowlarr) accesibles por nombre
    # En producción NO se publica ningún puerto: la única entrada es el proxy
    # (con Access List). Para pruebas locales, descomenta:
    # ports:
    #   - "8000:8000"

networks:
  proxy-net:
    external: true
  media-net:
    external: true
